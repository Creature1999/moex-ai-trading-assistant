services:
  - type: web
    name: moex-ai-trading-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: DB_PATH
        value: ./assistant.db
      - key: TICKERS
        value: SBER, GAZP, LKOH, ROSN, YDEX
      - key: MOEX_BOARD
        value: TQBR
      - key: SCAN_INTERVAL_MINUTES
        value: "0"
      - key: RSS_FEEDS
        value: ""
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
